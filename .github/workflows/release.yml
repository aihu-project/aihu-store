name: Release store

on:
  push:
    tags:
      - store-v*

permissions:
  contents: read
  id-token: write

concurrency:
  group: store-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm trusted publishing (OIDC) needs npm 11.5.1 or newer; no npm token is used.
      - name: Pin npm for trusted publishing
        run: npm install --global npm@11.5.1 --ignore-scripts
      - run: bun install --frozen-lockfile
      - run: bun run check:ci
      - name: Reject classic npm authentication
        run: |
          test "$(npm --version)" = "11.5.1"
          if [ -n "${NODE_AUTH_TOKEN:-}${NPM_TOKEN:-}" ]; then
            echo "Classic npm tokens are not allowed; publishing uses OIDC trusted publishing."
            exit 1
          fi
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "store-v$(node -p "require('./package.json').version")"
      - name: Publish package with OIDC provenance
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOOKUP_OUTPUT="$(mktemp)"
          if npm view "@aihu/store@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org >"$LOOKUP_OUTPUT" 2>&1; then
            echo "@aihu/store@$PACKAGE_VERSION is already published; nothing to do."
            exit 0
          fi
          if ! grep -Eq 'npm error code E404|E404|404 Not Found' "$LOOKUP_OUTPUT"; then
            cat "$LOOKUP_OUTPUT"
            echo "Registry lookup failed for a reason other than a confirmed E404; refusing to publish."
            exit 1
          fi
          npm publish --access public --provenance
